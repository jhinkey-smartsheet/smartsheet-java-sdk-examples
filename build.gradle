plugins {
    id 'application'
}

group = 'com.example.smartsheet'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.smartsheet:smartsheet-sdk-java:3.10.1'
    runtimeOnly 'org.slf4j:slf4j-simple:1.7.36'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'com.example.smartsheet.GetWorkspaceChildren'
}

tasks.named('test') {
    useJUnitPlatform()
}

def exampleMainClasses = [
        'com.example.smartsheet.GetWorkspaceChildren',
        'com.example.smartsheet.GetWorkspaceHierarchy',
        'com.example.smartsheet.GetFolderChildren',
        'com.example.smartsheet.GetAndDeleteShareSheet'
        'com.example.smartsheet.ShareSheet',
        'com.example.smartsheet.UpdateShareSheet',
        'com.example.smartsheet.LegacyGetFolder',
        'com.example.smartsheet.LegacyListFolders',
        'com.example.smartsheet.ListWorkspaces',
        'com.example.smartsheet.LegacyGetWorkspaceChildren',
        'com.example.smartsheet.LegacyGetWorkspaceHierarchy'
]

tasks.register('runExample', JavaExec) {
    group = 'application'
    description = 'Run any example: -PmainClass=<fqcn> [-PappArgs="arg1 arg2"]'
    classpath = sourceSets.main.runtimeClasspath

    doFirst {
        if (!project.hasProperty('mainClass') || !project.property('mainClass').toString().trim()) {
            throw new GradleException("Missing -PmainClass. Example: gradlew runExample -PmainClass=com.example.smartsheet.ListWorkspaces")
        }

        mainClass = project.property('mainClass').toString().trim()
        if (project.hasProperty('appArgs') && project.property('appArgs').toString().trim()) {
            args project.property('appArgs').toString().trim().split(/\s+/)
        }
    }
}

exampleMainClasses.each { fqcn ->
    def simpleName = fqcn.substring(fqcn.lastIndexOf('.') + 1)
    tasks.register("run${simpleName}", JavaExec) {
        group = 'application'
        description = "Run ${simpleName}."
        classpath = sourceSets.main.runtimeClasspath
        mainClass = fqcn
        if (project.hasProperty('appArgs') && project.property('appArgs').toString().trim()) {
            args project.property('appArgs').toString().trim().split(/\s+/)
        }
    }
}
